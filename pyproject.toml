[project]
name = "yt2rss"
version = "0.1.0"
description = "Self-hosted YouTube channels as podcast RSS feeds"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler==3.10.4",
    "feedgen>=1.0.0",
    "flask>=3.1.3",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "yt-dlp[default]>=2026.10.26",
]

[dependency-groups]
dev = [
    "feedparser>=6.0.14",
    "pytest>=9.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
    "pyright>=1.1.414",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
